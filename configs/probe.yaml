# One clean episode per task type per model, run before the real grid.
#
# It costs a few cents and it answers the two questions that can waste a whole row: does this
# model actually emit tool calls through this provider in this schema, and how many completion
# tokens does it really spend per episode. The second matters because a reasoning model can
# spend several times the tokens of a non-reasoning one, and a grid sized from the wrong
# profile either overruns the ceiling or stops half finished.
run_id: probe
world_seed: 7
task_seed: 11
tasks_per_type: 1
repeats: 1
max_tool_calls: 18
budget_usd: 1.50
workers: 8
save_traces: all
out_dir: runs
conditions: [clean]

agents:
  - kind: openrouter
    model: openai/gpt-oss-20b
    label: gpt-oss-20b
  - kind: openrouter
    model: openai/gpt-oss-120b
    label: gpt-oss-120b
  - kind: openrouter
    model: qwen/qwen3-235b-a22b-2507
    label: qwen3-235b
  - kind: openrouter
    model: deepseek/deepseek-chat-v3.1
    label: deepseek-v3.1
  - kind: openrouter
    model: openai/gpt-5-mini
    label: gpt-5-mini
  - kind: openrouter
    model: moonshotai/kimi-k2-0905
    label: kimi-k2
