# One clean episode per task type per model, run before the real grid.
#
# It costs about thirty cents and it answers the only question that can waste a whole row:
# does this model actually emit tool calls through this provider, in this schema, at this
# temperature. A model that returns prose instead of a tool call scores zero for reasons
# that have nothing to do with fault handling, and finding that out after paying for 620
# episodes is an expensive way to learn it.
run_id: probe
world_seed: 7
task_seed: 11
tasks_per_type: 1
repeats: 1
max_tool_calls: 18
budget_usd: 1.00
workers: 8
save_traces: all
out_dir: runs
conditions: [clean]

agents:
  - kind: together
    model: openai/gpt-oss-20b
    label: gpt-oss-20b
  - kind: together
    model: openai/gpt-oss-120b
    label: gpt-oss-120b
  - kind: together
    model: Qwen/Qwen3.7-Plus
    label: Qwen3.7-Plus
  - kind: together
    model: zai-org/GLM-4.7
    label: GLM-4.7
  - kind: together
    model: Qwen/Qwen3.7-Max
    label: Qwen3.7-Max
