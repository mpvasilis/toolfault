# The published grid.
#
# Five current open-weight models spanning 20B to frontier, plus the two free reference
# policies that bound the scale from both ends. Every model here is open weight and served
# by a provider anyone can sign up to, so the whole leaderboard is reproducible by a
# stranger with a key and twenty dollars. That is not a small property for a benchmark.
#
# 16 tasks per type gives 64 tasks and about 620 episodes per agent once the per-task
# condition support is applied. The rarest conditions land around n = 10 per model, which is
# thin: those cells are reported with their Wilson intervals and should be read as
# directional. The conditions that carry the headline (contradiction, truncated_list,
# unit_shift, wrong_entity) sit between n = 16 and n = 32.
run_id: bench-v1
world_seed: 7
task_seed: 11
tasks_per_type: 16
repeats: 1
max_tool_calls: 18
budget_usd: 23.00
workers: 24
save_traces: failures
trace_sample: 0.15
out_dir: results

agents:
  - kind: oracle
  - kind: naive
  - kind: together
    model: openai/gpt-oss-20b
    label: gpt-oss-20b
  - kind: together
    model: openai/gpt-oss-120b
    label: gpt-oss-120b
  - kind: together
    model: Qwen/Qwen3.7-Plus
    label: Qwen3.7-Plus
  - kind: together
    model: zai-org/GLM-4.7
    label: GLM-4.7
  - kind: together
    model: Qwen/Qwen3.7-Max
    label: Qwen3.7-Max
