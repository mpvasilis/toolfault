name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.13.7"

      - name: Install
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Tests
        run: uv run --no-sync pytest

      - name: Solvability gate
        run: uv run --no-sync toolfault selftest --tasks-per-type 8 --quiet

      - name: Determinism gate
        if: runner.os == 'Linux'
        run: |
          uv run --no-sync toolfault selftest --tasks-per-type 6 --run-id det-a --workers 1 --quiet
          uv run --no-sync toolfault selftest --tasks-per-type 6 --run-id det-b --workers 8 --quiet
          uv run --no-sync python - <<'PY'
          import json, pathlib, sys

          def rows(run):
              path = pathlib.Path("runs") / run / "episodes.jsonl"
              out = {}
              for line in path.read_text(encoding="utf-8").splitlines():
                  row = json.loads(line)
                  key = (row["agent"], row["task_id"], row["condition"], row["repeat"])
                  out[key] = (row["answer"], row["terminal"], row["outcome"], row["tool_call_count"])
              return out

          a, b = rows("det-a"), rows("det-b")
          if a != b:
              differing = [k for k in a if a.get(k) != b.get(k)]
              print(f"non-deterministic across {len(differing)} cells, e.g. {differing[:5]}")
              sys.exit(1)
          print(f"deterministic across {len(a)} cells")
          PY
